name: Update Mastered Words

on:
  workflow_dispatch:
    inputs:
      mastered_json:
        description: 'JSON array of mastered words'
        required: true
        type: string

permissions:
  contents: write

jobs:
  commit-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge and update progress.json
        env:
          NEW_WORDS: ${{ inputs.mastered_json }}
        run: |
          python3 -c '
          import json, os
          path = "progress.json"
          current = json.load(open(path)) if os.path.exists(path) else []
          incoming = json.loads(os.environ["NEW_WORDS"])
          merged = sorted(list(set(current + incoming)))
          with open(path, "w", encoding="utf-8") as f:
              json.dump(merged, f, ensure_ascii=False, indent=2)
          '

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git diff --cached --quiet || git commit -m "Update progress.json"
          git push
